name: Feature Request
description: Suggest a new metric, capability, or improvement for RDA.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make RDA better? We'd love to hear it. Please describe
        the problem you're trying to solve — not just the solution — so we can
        evaluate whether it fits RDA's design philosophy.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem or pain point does this feature address? Why does the current tooling fall short?
      placeholder: "When auditing datasets from X robot, I find that..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like. If it's a new metric, explain what it should detect and how.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or tools have you tried?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — would significantly improve my workflow
        - Critical — blocking my use of RDA
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any references to papers, existing tools, or examples that illustrate the idea.
    validations:
      required: false
